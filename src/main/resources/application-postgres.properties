# Profile "postgres": banco real e persistente no lugar do H2 em memória.
# Ativar com: ./mvnw spring-boot:run -Dspring-boot.run.profiles=postgres
# Só o que muda em relação ao application.properties fica aqui; o resto é herdado.
# Os valores padrão batem com o compose.yaml; em outro ambiente, use as variáveis.

spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/chamados}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.username=${DB_USERNAME:chamados}
spring.datasource.password=${DB_PASSWORD:chamados}

# update cria/ajusta as tabelas a partir das entities, como no H2. Num sistema
# em produção o esquema seria versionado com Flyway/Liquibase (ddl-auto=validate).
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false

# O console web é só do H2.
spring.h2.console.enabled=false
