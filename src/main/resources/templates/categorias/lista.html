<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Categorias')}"></head>
<body>
<nav th:replace="~{fragments/layout :: menu}"></nav>
<main class="container">
    <div class="d-flex justify-content-between align-items-center mb-3">
        <h1 class="h3 mb-0">Categorias</h1>
        <a th:if="${ehAdmin}" th:href="@{/app/categorias/novo}" class="btn btn-primary">Nova categoria</a>
    </div>

    <div th:replace="~{fragments/layout :: mensagens}"></div>

    <div th:if="${categorias.isEmpty()}" class="alert alert-light border">Nenhuma categoria cadastrada.</div>

    <table th:unless="${categorias.isEmpty()}" class="table bg-white border">
        <thead class="table-light">
        <tr>
            <th>Nome</th>
            <th>Descrição</th>
            <th th:if="${ehAdmin}" class="text-end">Ações</th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="categoria : ${categorias}">
            <td th:text="${categoria.nome}">Hardware</td>
            <td th:text="${categoria.descricao} ?: '-'">Problemas com equipamentos</td>
            <td th:if="${ehAdmin}" class="text-end">
                <a th:href="@{/app/categorias/{id}/editar(id=${categoria.id})}" class="btn btn-sm btn-outline-secondary">Editar</a>
                <form th:action="@{/app/categorias/{id}/excluir(id=${categoria.id})}" method="post" class="d-inline"
                      onsubmit="return confirm('Excluir esta categoria?');">
                    <button type="submit" class="btn btn-sm btn-outline-danger">Excluir</button>
                </form>
            </td>
        </tr>
        </tbody>
    </table>
</main>
<th:block th:replace="~{fragments/layout :: scripts}"></th:block>
</body>
</html>
