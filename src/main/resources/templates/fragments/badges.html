<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<body>
<!--
  Status e prioridade do chamado com cor. O texto vem do messages.properties.
  Uso: th:replace="~{fragments/badges :: status(${c.status})}"
-->

<th:block th:fragment="status(s)" th:switch="${s.name()}">
    <span th:case="'ABERTO'" class="badge text-bg-primary" th:text="#{status.ABERTO}">Aberto</span>
    <span th:case="'EM_ATENDIMENTO'" class="badge text-bg-dark" th:text="#{status.EM_ATENDIMENTO}">Em atendimento</span>
    <span th:case="'AGUARDANDO_CLIENTE'" class="badge text-bg-light border" th:text="#{status.AGUARDANDO_CLIENTE}">Aguardando cliente</span>
    <span th:case="'FECHADO'" class="badge text-bg-secondary" th:text="#{status.FECHADO}">Fechado</span>
</th:block>

<th:block th:fragment="prioridade(p)" th:switch="${p.name()}">
    <span th:case="'BAIXA'" class="badge text-bg-success" th:text="#{prioridade.BAIXA}">Baixa</span>
    <span th:case="'MEDIA'" class="badge text-bg-info" th:text="#{prioridade.MEDIA}">Média</span>
    <span th:case="'ALTA'" class="badge text-bg-warning" th:text="#{prioridade.ALTA}">Alta</span>
    <span th:case="'CRITICA'" class="badge text-bg-danger" th:text="#{prioridade.CRITICA}">Crítica</span>
</th:block>

</body>
</html>
