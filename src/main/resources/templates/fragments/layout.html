<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<!--
  Pedaços repetidos em todas as telas. Cada página inclui com th:replace:
  head, menu, mensagens e scripts.
-->
<head th:fragment="head(titulo)">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title th:text="${titulo} + ' - Sistema de Chamados'">Sistema de Chamados</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH"
          crossorigin="anonymous">
    <link rel="stylesheet" th:href="@{/css/app.css}">
</head>
<body>

<nav th:fragment="menu" class="navbar navbar-expand-lg navbar-dark bg-primary mb-4">
    <div class="container">
        <a class="navbar-brand" th:href="@{/app}">Sistema de Chamados</a>
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse"
                data-bs-target="#menuPrincipal" aria-controls="menuPrincipal"
                aria-expanded="false" aria-label="Abrir menu">
            <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="menuPrincipal">
            <ul class="navbar-nav me-auto">
                <li class="nav-item"><a class="nav-link" th:href="@{/app}">Início</a></li>
                <li class="nav-item"><a class="nav-link" th:href="@{/app/chamados}">Chamados</a></li>
                <li class="nav-item"><a class="nav-link" th:href="@{/app/clientes}">Clientes</a></li>
                <li class="nav-item"><a class="nav-link" th:href="@{/app/categorias}">Categorias</a></li>
                <li class="nav-item"><a class="nav-link" th:href="@{/app/tecnicos}">Técnicos</a></li>
                <li th:if="${ehAdmin}" class="nav-item"><a class="nav-link" th:href="@{/app/dashboard}">Dashboard</a></li>
            </ul>
            <span class="navbar-text me-3">
                Logado como <strong th:text="${usuarioLogado}">usuario</strong>
            </span>
            <form th:action="@{/logout}" method="post">
                <button type="submit" class="btn btn-outline-light btn-sm">Sair</button>
            </form>
        </div>
    </div>
</nav>

<!-- Mensagens que os controllers mandam depois de um redirect (RedirectAttributes) -->
<div th:fragment="mensagens">
    <div th:if="${sucesso}" class="alert alert-success" th:text="${sucesso}">Salvo</div>
    <div th:if="${erro}" class="alert alert-danger" th:text="${erro}">Erro</div>
</div>

<th:block th:fragment="scripts">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"
            integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz"
            crossorigin="anonymous"></script>
</th:block>

</body>
</html>
