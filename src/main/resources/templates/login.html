<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Entrar')}"></head>
<body>
<main class="container">
    <div class="card shadow-sm login-box">
        <div class="card-body p-4">
            <h1 class="h4 mb-4 text-center">Sistema de Chamados</h1>

            <div th:if="${param.error}" class="alert alert-danger">Usuário ou senha inválidos.</div>
            <div th:if="${param.saiu}" class="alert alert-info">Você saiu do sistema.</div>

            <!-- O Spring Security recebe o POST /login com os campos username e password -->
            <form th:action="@{/login}" method="post">
                <div class="mb-3">
                    <label for="username" class="form-label">Usuário</label>
                    <input type="text" id="username" name="username" class="form-control" required autofocus>
                </div>
                <div class="mb-3">
                    <label for="password" class="form-label">Senha</label>
                    <input type="password" id="password" name="password" class="form-control" required>
                </div>
                <button type="submit" class="btn btn-primary w-100">Entrar</button>
            </form>
        </div>
    </div>
    <p class="text-center text-muted small">
        Usuários de teste: usuario / usuario123, tecnico / tecnico123, admin / admin123
    </p>
</main>
</body>
</html>
